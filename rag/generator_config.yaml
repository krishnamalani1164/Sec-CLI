generation:
  rows_per_tool: 5000
  min_commands: 25
  max_commands: 40
  output_file: rag_dataset.csv

  pools:
    targets:
      - 192.168.1.0/24
      - 10.0.0.0/24
      - 172.16.0.0/16
      - 10.10.10.10
      - 192.168.56.1
  
    urls:
      - http://test.com?id=1
      - http://example.com/login.php
      - https://target.local
      - http://intranet.local/page.php?id=5

tools:

# 1. NMAP
- name: nmap
  mitre_stage: Discovery
  intents:
    - intent: Identify live hosts on a network
      category: Network Service Discovery
      templates:
        - "nmap -sn {target}"
        - "nmap -PR {target}"
        - "nmap -PE {target}"
        - "nmap --disable-arp-ping -sn {target}"
        - "nmap -T4 -sn {target}"
        - "nmap --min-rate 500 -sn {target}"

    - intent: Identify open TCP and UDP ports
      category: Port Scanning
      templates:
        - "nmap -sS {target}"
        - "nmap -sT {target}"
        - "nmap -p 1-65535 {target}"
        - "nmap --top-ports 100 {target}"
        - "nmap -sU -p 53 {target}"

# 2. MASSCAN
- name: masscan
  mitre_stage: Discovery
  intents:
    - intent: Perform high-speed port scans
      category: High-Speed Port Scanning
      templates:
        - "masscan {target} -p80"
        - "masscan {target} -p1-65535 --rate 10000"
        - "masscan {target} -p22,80,443"
        - "masscan {target} -p0-65535 --rate 5000"

# 3. AMASS
- name: amass
  mitre_stage: Discovery
  intents:
    - intent: Enumerate subdomains for attack surface mapping
      category: Subdomain Enumeration
      templates:
        - "amass enum -d example.com"
        - "amass enum -passive -d example.com"
        - "amass enum -active -d example.com"
        - "amass intel -d example.com"

# 4. GOBUSTER
- name: gobuster
  mitre_stage: Discovery
  intents:
    - intent: Discover hidden web content
      category: Content Discovery
      templates:
        - "gobuster dir -u {url} -w common.txt"
        - "gobuster dir -u {url} -w common.txt -x php,html"
        - "gobuster vhost -u {url} -w vhosts.txt"
        - "gobuster dns -d example.com -w dns.txt"

# 5. ENUM4LINUX
- name: enum4linux
  mitre_stage: Discovery
  intents:
    - intent: Enumerate SMB and Windows domain information
      category: SMB Enumeration
      templates:
        - "enum4linux -a {target}"
        - "enum4linux -U {target}"
        - "enum4linux -S {target}"
        - "enum4linux -G {target}"

# 6. SQLMAP
- name: sqlmap
  mitre_stage: Execution
  intents:
    - intent: Exploit SQL injection vulnerabilities
      category: SQL Injection Exploitation
      templates:
        - "sqlmap -u {url}"
        - "sqlmap -u {url} --dbs"
        - "sqlmap -u {url} --tables"
        - "sqlmap -u {url} --dump"
        - "sqlmap -u {url} --batch"

# 7. NIKTO
- name: nikto
  mitre_stage: Discovery
  intents:
    - intent: Identify web server vulnerabilities
      category: Web Vulnerability Scanning
      templates:
        - "nikto -h {url}"
        - "nikto -h {url} -ssl"
        - "nikto -h {url} -Tuning x"
        - "nikto -h {url} -Plugins apache"

# 8. WF UZZ
- name: wfuzz
  mitre_stage: Discovery
  intents:
    - intent: Fuzz web parameters and endpoints
      category: Web Fuzzing
      templates:
        - "wfuzz -c -z file,wordlist.txt {url}/FUZZ"
        - "wfuzz -d \"id=FUZZ\" {url}"
        - "wfuzz -H \"User-Agent: FUZZ\" {url}"

# 9. FFUF
- name: ffuf
  mitre_stage: Discovery
  intents:
    - intent: Perform fast web fuzzing
      category: Directory and Parameter Fuzzing
      templates:
        - "ffuf -u {url}/FUZZ -w wordlist.txt"
        - "ffuf -u {url}?id=FUZZ -w wordlist.txt"
        - "ffuf -H \"Host: FUZZ.example.com\" -u {url}"

# 10. HYDRA
- name: hydra
  mitre_stage: Credential Access
  intents:
    - intent: Perform online credential brute force attacks
      category: Brute Force Authentication
      templates:
        - "hydra -l admin -P passwords.txt ssh://{target}"
        - "hydra -L users.txt -P passwords.txt ftp://{target}"
        - "hydra -l root -P passwords.txt telnet://{target}"
        - "hydra -L users.txt -P passwords.txt http-get://{target}"

# 11. JOHN
- name: john
  mitre_stage: Credential Access
  intents:
    - intent: Crack password hashes offline
      category: Password Cracking
      templates:
        - "john hashes.txt"
        - "john --wordlist=rockyou.txt hashes.txt"
        - "john --rules hashes.txt"

# 12. HASHCAT
- name: hashcat
  mitre_stage: Credential Access
  intents:
    - intent: Perform GPU-accelerated password cracking
      category: Hash Cracking
      templates:
        - "hashcat -m 0 hashes.txt rockyou.txt"
        - "hashcat -a 3 hashes.txt ?a?a?a?a"
        - "hashcat -b"

# 13. METASPLOIT
- name: metasploit
  mitre_stage: Execution
  intents:
    - intent: Exploit vulnerable services
      category: Exploit Execution
      templates:
        - "msfconsole -q"
        - "use exploit/multi/handler"
        - "set PAYLOAD windows/meterpreter/reverse_tcp"
        - "run"

# 14. SEARCHSPLOIT
- name: searchsploit
  mitre_stage: Discovery
  intents:
    - intent: Search for known public exploits
      category: Exploit Discovery
      templates:
        - "searchsploit apache"
        - "searchsploit windows smb"
        - "searchsploit -t openssl"

# 15. TCPDUMP
- name: tcpdump
  mitre_stage: Collection
  intents:
    - intent: Capture live network traffic
      category: Packet Capture
      templates:
        - "tcpdump -i eth0"
        - "tcpdump -i eth0 port 80"
        - "tcpdump -w capture.pcap"

# 16. TSHARK
- name: tshark
  mitre_stage: Collection
  intents:
    - intent: Analyze packet capture files
      category: Packet Analysis
      templates:
        - "tshark -r capture.pcap"
        - "tshark -r capture.pcap -Y http"
        - "tshark -T fields -e ip.src"

# 17. CRACKMAPEXEC
- name: crackmapexec
  mitre_stage: Lateral Movement
  intents:
    - intent: Validate credentials across network hosts
      category: Credential Validation
      templates:
        - "crackmapexec smb {target} -u users.txt -p passwords.txt"
        - "crackmapexec smb {target} --shares"
        - "crackmapexec smb {target} -u admin -p password"

# 18. IMPACKET
- name: impacket
  mitre_stage: Lateral Movement
  intents:
    - intent: Execute remote commands via SMB and Kerberos
      category: Remote Command Execution
      templates:
        - "psexec.py user@{target}"
        - "wmiexec.py user@{target}"
        - "smbexec.py user@{target}"

# 19. RADARE2
- name: radare2
  mitre_stage: Defense Evasion
  intents:
    - intent: Perform static and dynamic binary analysis
      category: Reverse Engineering
      templates:
        - "r2 binary.exe"
        - "r2 -A binary.exe"
        - "r2 -d binary.exe"

# 20. YARA
- name: yara
  mitre_stage: Discovery
  intents:
    - intent: Detect malware using pattern matching
      category: Malware Detection
      templates:
        - "yara rules.yar file.bin"
        - "yara -r rules.yar /path/to/files"
        - "yara -m rules.yar memory.dump"
